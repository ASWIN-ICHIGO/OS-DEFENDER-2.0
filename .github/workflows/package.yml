name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Build .deb package
        run: |
          chmod +x installer/linux/build-deb.sh
          VERSION="${GITHUB_REF_NAME#v}" ./installer/linux/build-deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: os-defender-linux-deb
          path: target/packages/*.deb
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: os-defender-linux-binaries
          path: |
            target/release/os-defender-agent
            target/release/os-defender

  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: os-defender-windows-binaries
          path: |
            target/release/os-defender-agent.exe
            target/release/os-defender.exe

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os-defender-linux-deb/*.deb
            os-defender-linux-binaries/os-defender-agent
            os-defender-linux-binaries/os-defender
            os-defender-windows-binaries/os-defender-agent.exe
            os-defender-windows-binaries/os-defender.exe
          generate_release_notes: true
