name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: Build release
        run: cargo build --release
      - name: Build .deb package
        run: |
          chmod +x installer/linux/build-deb.sh
          VERSION="${GITHUB_REF_NAME#v}" ./installer/linux/build-deb.sh
      - name: Sign binaries
        if: env.SIGNING_PRIVATE_KEY != ''
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          echo "$SIGNING_PRIVATE_KEY" > /tmp/signing.key
          chmod 600 /tmp/signing.key
          chmod +x scripts/sign-binary.sh
          ./scripts/sign-binary.sh target/release/os-defender-agent /tmp/signing.key
          ./scripts/sign-binary.sh target/release/os-defender /tmp/signing.key
          rm /tmp/signing.key
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: os-defender-linux-deb
          path: target/packages/*.deb
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: os-defender-linux-binaries
          path: |
            target/release/os-defender-agent
            target/release/os-defender
            target/release/os-defender-agent.sha256
            target/release/os-defender-agent.sig
            target/release/os-defender.sha256
            target/release/os-defender.sig

  build-linux-desktop:
    name: Build Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: Build Tauri desktop app
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --ci
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: os-defender-linux-desktop
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Compute checksums
        shell: pwsh
        run: |
          $agent = Get-FileHash target/release/os-defender-agent.exe -Algorithm SHA256
          $cli = Get-FileHash target/release/os-defender.exe -Algorithm SHA256
          $agent.Hash.ToLower() | Out-File -NoNewline target/release/os-defender-agent.exe.sha256
          $cli.Hash.ToLower() | Out-File -NoNewline target/release/os-defender.exe.sha256
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: os-defender-windows-binaries
          path: |
            target/release/os-defender-agent.exe
            target/release/os-defender.exe
            target/release/os-defender-agent.exe.sha256
            target/release/os-defender.exe.sha256

  build-windows-desktop:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Tauri desktop app
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --ci
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: os-defender-windows-desktop
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  build-ai:
    name: Build AI Layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test AI layer
        working-directory: ai
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/ -v
          ruff check .
      - name: Package AI layer
        run: |
          mkdir -p ai-dist
          cp -r ai/src ai-dist/
          cp ai/pyproject.toml ai-dist/
          tar czf ai-layer.tar.gz -C ai-dist .
      - name: Upload AI package
        uses: actions/upload-artifact@v4
        with:
          name: os-defender-ai-layer
          path: ai-layer.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-linux-desktop, build-windows, build-windows-desktop, build-ai]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os-defender-linux-deb/*.deb
            os-defender-linux-binaries/os-defender-agent
            os-defender-linux-binaries/os-defender
            os-defender-linux-binaries/*.sha256
            os-defender-linux-binaries/*.sig
            os-defender-linux-desktop/*.deb
            os-defender-linux-desktop/*.AppImage
            os-defender-windows-binaries/os-defender-agent.exe
            os-defender-windows-binaries/os-defender.exe
            os-defender-windows-binaries/*.sha256
            os-defender-windows-desktop/*.exe
            os-defender-windows-desktop/*.msi
            os-defender-ai-layer/ai-layer.tar.gz
          generate_release_notes: true
