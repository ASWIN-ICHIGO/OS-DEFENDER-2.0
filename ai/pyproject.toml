[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "os-defender-ai"
version = "2.0.0a1"
description = "OS-DEFENDER AI intelligence engine: anomaly detection, behavioural analysis, local LLM"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "onnxruntime>=1.19",
    "pydantic>=2.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "skl2onnx>=1.17",
]
llm = [
    "llama-cpp-python>=0.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests that require ONNX export (deselect with '-m \"not slow\"')"]

[tool.setuptools.packages.find]
include = ["features*", "training*", "inference*", "llm*"]
