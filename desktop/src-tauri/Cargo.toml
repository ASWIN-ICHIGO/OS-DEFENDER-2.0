[package]
name = "os-defender-desktop"
version = "2.0.0-alpha.1"
edition = "2024"
authors = ["Aswin <caswin548@gmail.com>"]
license = "MIT"
description = "OS Defender 2.0 desktop application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["io-util", "net", "rt-multi-thread", "macros"] }

[dependencies.os-defender-core]
path = "../../crates/os-defender-core"
